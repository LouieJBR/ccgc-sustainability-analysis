name: Build and deploy Angular app to Azure Web App - ccgc-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build Angular app
        working-directory: ccgc-frontend
        run: |
          npm install
          npm run build --prod

      - name: Zip built app for deployment
        run: |
          cd ccgc-frontend/dist/frontend
          zip -r ../../release.zip ./*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ccgc-frontend/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B2BA28F44DEF4DACB64AB88A390AC6A8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_18E82DF1E68146809034126C728281AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8DBD2280C9544C009F7822D049426E4D }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ccgc-frontend'
          slot-name: 'Production'
          package: .
