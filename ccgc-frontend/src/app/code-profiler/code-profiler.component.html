<div class="code-profiler">
  <h2>Submit Code for Analysis</h2>

  <form (ngSubmit)="submitCode()">
    <label for="language">Language:</label>
    <select id="language" [(ngModel)]="language" name="language" required>
      <option value="python">Python</option>
      <option value="js">JavaScript</option>
      <option value="java">Java</option>
    </select>

    <label for="fileName">File Name Hint:</label>
    <input id="fileName" [(ngModel)]="fileNameHint" name="fileNameHint" required />

    <label for="code">Code:</label>
    <textarea id="code" rows="10" [(ngModel)]="code" name="code" required></textarea>

    <button type="submit">Analyze</button>
  </form>

  <div *ngIf="result">
    <h3>Results</h3>
    <p><strong>Green Score:</strong> {{ result.greenScore }}</p>
    <p><strong>CPU Time (ms):</strong> {{ result.cpuTimeMs }}</p>
    <p><strong>Memory Used (MB):</strong> {{ result.memoryUsedMb }}</p>
    <p><strong>Estimated Energy (Joules):</strong> {{ result.estimatedEnergyJoules }}</p>
    <p><strong>Carbon Intensity:</strong> {{ result.carbonIntensity }}</p>
    <p><strong>Suggestions:</strong></p>
    <ul>
      <li *ngFor="let s of result.suggestions">{{ s }}</li>
    </ul>
  </div>
</div>
